name: Story videos

on:
  schedule:
    - cron: "15 0 * * *" # renders tomorrow + the day after, well before the ~9 AM / ~7 PM IST posts
    - cron: "15 12 * * *" # second pass picks up anything the first run did not finish
  workflow_dispatch:
    inputs:
      dates:
        description: "Space-separated UTC dates to render (YYYY-MM-DD). Default: tomorrow and the day after"
        required: false

permissions:
  contents: write

concurrency:
  group: story-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Piper and the character voices (free, open source)
        run: |
          python3 -m pip install --user piper-tts==1.8.0
          mkdir -p ~/voices
          for v in en_US/ryan/high en_US/lessac/high en_US/joe/medium en_GB/cori/high en_GB/alan/medium en_US/amy/medium en_US/bryce/medium; do
            lang=$(echo $v | cut -d/ -f1); name=$(echo $v | cut -d/ -f2); q=$(echo $v | cut -d/ -f3)
            id="$lang-$name-$q"
            base="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/$v"
            curl -sSfL --retry 3 -o ~/voices/$id.onnx "$base/$id.onnx"
            curl -sSfL --retry 3 -o ~/voices/$id.onnx.json "$base/$id.onnx.json"
          done

      - run: npm ci

      - name: Install the 3D renderer (Remotion + Three.js)
        working-directory: remotion
        run: |
          npm ci
          npx remotion browser ensure

      - name: Check out the media branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 -b media "$url" "$RUNNER_TEMP/media"; then
            mkdir -p "$RUNNER_TEMP/media" && cd "$RUNNER_TEMP/media" && git init -q -b media && git remote add origin "$url"
          fi
          cd "$RUNNER_TEMP/media"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"

      - name: Render and publish the videos
        env:
          PIPER: /home/runner/.local/bin/piper
          PIPER_VOICE: /home/runner/voices/en_US-ryan-high.onnx
          REMOTION_GL: swangle
          CONCURRENCY: "4"
          MEDIA_DIR: ${{ runner.temp }}/media
          PUSH: "1"
          TIME_BUDGET_MIN: "290"
        run: npx tsx video/daily.ts ${{ github.event.inputs.dates }}

      - name: Keep new backdrops on the code branches
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add assets/backdrops
          git diff --cached --quiet && exit 0
          git commit -m "Cache new story backdrops"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
